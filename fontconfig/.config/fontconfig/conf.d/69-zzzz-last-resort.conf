<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <description>Use Last Resort font as last resort!</description>
  <match>
    <test name="family" qual="any" compare="not_eq">
      <string>NotExistedFont</string>
    </test>
    <edit name="family" mode="append_last">
      <string>Last Resort High-Efficiency</string>
      <string>Last Resort</string>
    </edit>
  </match>
</fontconfig>
