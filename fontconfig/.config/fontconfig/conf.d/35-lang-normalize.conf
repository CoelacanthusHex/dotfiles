<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Support complex lang attribute normalization</description>
  <!-- Workaround for some fonts locl font feature has no support for zh-Hant/zh-Hans -->
  <!--
    see https://bugzilla.mozilla.org/show_bug.cgi?id=739861
    and https://bugzilla.mozilla.org/show_bug.cgi?id=556237
    and https://bugzilla.mozilla.org/show_bug.cgi?id=1919527
  -->

  <match>
    <test name="lang" compare="contains">
      <string>zh-Hant-HK</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-HK</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-Hant-MO</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-HK</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-MO</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-HK</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>yue</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-HK</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-Hant</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-TW</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-cmn-Hant</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-TW</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>zh-SG</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-CN</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-MY</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-CN</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-Hans</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-CN</string>
    </edit>
  </match>
  <match>
    <test name="lang" compare="contains">
      <string>zh-cmn-Hans</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <string>zh-CN</string>
    </edit>
  </match>
</fontconfig>
<!-- vim: set nu sts=2 sw=2 et: -->
<!-- kate: space-indent on; indent-width 2; syntax xml; -->
