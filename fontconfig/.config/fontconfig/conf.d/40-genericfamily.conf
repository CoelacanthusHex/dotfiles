<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Support fontconfig genericfamily mechanism</description>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>serif</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>serif</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>sans-serif</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>monospace</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>monospace</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>cursive</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>cursive</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>fantasy</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>fantasy</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>system-ui</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>system-ui</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>ui-serif</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>ui-serif</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>ui-sans-serif</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>ui-sans-serif</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>ui-monospace</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>ui-monospace</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>ui-rounded</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>ui-rounded</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>emoji</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>emoji</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>math</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>math</string>
    </edit>
  </match>
  <match>
    <test qual="all" name="genericfamily" compare="eq">
      <const>fangsong</const>
    </test>
    <edit name="family" mode="append" binding="same">
      <string>fangsong</string>
    </edit>
  </match>
</fontconfig>
<!-- vim: set nu sts=2 sw=2 et: -->
<!-- kate: space-indent on; indent-width 2; syntax xml; -->
