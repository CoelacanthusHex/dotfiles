<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Reject fonts I don't like'</description>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/Adwaita/*</glob>
      <glob>/usr/share/fonts/adobe-source-code-pro/*</glob>
      <glob>/usr/share/fonts/TTF/DejaVu*</glob>
      <glob>/usr/share/fonts/TTF/Hack-*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
