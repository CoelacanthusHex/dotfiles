# Multiple VRF shouldn't have the same associated routing table
net.vrf.strict_mode = 1
# lets any UDP socket without a device binding receive matching traffic from
# any VRF in the same network namespace, so WG can receive packets via ranet
# https://www.kernel.org/doc/html/latest/networking/vrf.html#applications
net.ipv4.tcp_l3mdev_accept = 1
net.ipv4.udp_l3mdev_accept = 1
#net.ipv4.raw_l3mdev_accept = 1 # has been enabled by default
# Bitmask of ICMP extensions to append to ICMPv4 error messages
# 0x01: Incoming IP interface information according to RFC 5837. Extension will
#       include the index, IPv4 address (if present), name and MTU of the IP
#       interface that received the datagram which elicited the ICMP error.
net.ipv4.icmp_errors_extension_mask = 0x01
net.ipv6.icmp_errors_extension_mask = 0x01
